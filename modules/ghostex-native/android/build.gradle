plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ghostexnative'
version = '0.1.0'

android {
  namespace "expo.modules.ghostexnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // R8 rules for the libraries this module links (release builds minify).
    consumerProguardFiles "proguard-rules.pro"
  }
  sourceSets {
    main {
      // Share the exact JetBrains Mono Nerd Font asset used by the iOS pod.
      assets.srcDir project.file('../../../assets/fonts')
    }
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    // The vendored emulator logs through android.util.Log when it has no session client.
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // React Native's own view tags (the `nativeID` a chat message reads in GhostexSelectionMenuView.kt).
  // The app already ships it; the version comes from React Native's Gradle plugin, as in expo-modules-core.
  implementation 'com.facebook.react:react-android'

  // SSH transport: same coordinates as the Ghostex Android fork (app/build.gradle).
  // bcprov is declared directly because Ghostex replaces Android's stale platform "BC"
  // provider with the bundled BouncyCastle before SSHJ builds crypto primitives.
  // expo-updates verifies update signatures with BouncyCastle's jdk15to18 build (bcutil 1.81),
  // and two builds of the same classes fail checkReleaseDuplicateClasses, so sshj gets that build
  // too instead of its own jdk18on one.
  implementation("com.hierynomus:sshj:0.40.0") {
    exclude group: "org.bouncycastle"
  }
  implementation "org.bouncycastle:bcprov-jdk15to18:1.81"
  implementation "org.bouncycastle:bcpkix-jdk15to18:1.81"

  // The vendored Termux terminal-emulator/terminal-view Java sources use androidx.annotation.
  implementation "androidx.annotation:annotation:1.9.1"

  // NotificationCompat/ContextCompat for the persistent foreground-service notification.
  implementation "androidx.core:core-ktx:1.15.0"
  // GitHub #495: the approver key signs only after BiometricPrompt (GhostexApproverKey.kt).
  implementation "androidx.biometric:biometric:1.1.0"

  // The voice agent's `/api/voice` socket (GhostexVoice.kt). React Native already ships OkHttp;
  // this only puts it on the module's compile path, and Gradle keeps the app's newer version.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"

  // tailcat control-plane-free tunnel bridge (gomobile `bind` output, built in
  // the Ghostex main repo and staged unpacked: AGP refuses local .aar deps in a
  // library module, so the bridge ships as libs/tailcatbridge.jar (classes,
  // embedded into this module's AAR) + src/main/jniLibs/<abi>/libgojni.so.
  // GhostexSshConnection uses dev.ghostex.tailcatbridge.Tailcatbridge to dial
  // SSH over tailcat.
  implementation files("libs/tailcatbridge.jar")

  testImplementation "junit:junit:4.13.2"
}
