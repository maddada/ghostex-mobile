plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ghostexnative'
version = '0.1.0'

android {
  namespace "expo.modules.ghostexnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  sourceSets {
    main {
      // Share the exact JetBrains Mono Nerd Font asset used by the iOS pod.
      assets.srcDir project.file('../../../assets/fonts')

      // Session Chat's bundled webview page, generated in the Ghostex main repo
      // by `bun run build:mobile-chat`. Each srcDir's CONTENTS land at the APK
      // assets root, so pointing at assets/webview (not assets/webview/
      // session-chat) is what puts the page at
      // file:///android_asset/session-chat/index.html — the URL
      // src/chat/SessionChatWebView.tsx loads. Serving it from a real URL
      // instead of an HTML string is what gives the page a base URL, so it can
      // pull in Shiki grammars on demand for syntax highlighting.
      assets.srcDir project.file('../../../assets/webview')
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // SSH transport: same coordinates as the Ghostex Android fork (app/build.gradle).
  // bcprov is declared directly because Ghostex replaces Android's stale platform "BC"
  // provider with the bundled BouncyCastle before SSHJ builds crypto primitives.
  implementation "com.hierynomus:sshj:0.40.0"
  implementation "org.bouncycastle:bcprov-jdk18on:1.80.2"

  // The vendored Termux terminal-emulator/terminal-view Java sources use androidx.annotation.
  implementation "androidx.annotation:annotation:1.9.1"

  // NotificationCompat/ContextCompat for the persistent foreground-service notification.
  implementation "androidx.core:core-ktx:1.15.0"
}
