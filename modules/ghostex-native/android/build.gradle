plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ghostexnative'
version = '0.1.0'

android {
  namespace "expo.modules.ghostexnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // SSH transport: same coordinates as the Ghostex Android fork (app/build.gradle).
  // bcprov is declared directly because Ghostex replaces Android's stale platform "BC"
  // provider with the bundled BouncyCastle before SSHJ builds crypto primitives.
  implementation "com.hierynomus:sshj:0.40.0"
  implementation "org.bouncycastle:bcprov-jdk18on:1.80.2"

  // The vendored Termux terminal-emulator/terminal-view Java sources use androidx.annotation.
  implementation "androidx.annotation:annotation:1.9.1"
}
